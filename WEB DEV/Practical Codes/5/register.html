<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register — StudentHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <a href="index.html" class="logo">StudentHub</a>
  <nav class="main-nav" id="main-nav" aria-label="Main navigation">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="register.html" aria-current="page">Register</a></li>
    </ul>
  </nav>
  <div class="header-controls">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>
  </div>
</header>

<main id="main-content">
  <div class="form-shell">
    <div class="form-card wide">
      <h1>Create your account</h1>
      <p class="form-sub">Takes about two minutes.</p>

      <form id="register-form" action="dashboard.html" method="post" novalidate>
        <div class="field">
          <label for="fullname">Full name</label>
          <input type="text" id="fullname" name="fullname" autocomplete="name" aria-describedby="fullname-error" required>
          <span class="field-error" id="fullname-error"></span>
        </div>

        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" name="email" autocomplete="email" aria-describedby="email-error" required>
          <span class="field-error" id="email-error"></span>
        </div>

        <div class="field">
          <label for="mobile">Mobile number</label>
          <input type="tel" id="mobile" name="mobile" autocomplete="tel" aria-describedby="mobile-error" required>
          <span class="field-error" id="mobile-error"></span>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" name="password" autocomplete="new-password" aria-describedby="password-error password-strength" required>
            <span class="field-error" id="password-error"></span>
            <p class="password-strength" id="password-strength"></p>
          </div>
          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" aria-describedby="confirm-password-error" required>
            <span class="field-error" id="confirm-password-error"></span>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="course">Course</label>
            <select id="course" name="course" aria-describedby="course-error" required>
              <option value="">Select course</option>
              <option>B.Tech Computer Engineering</option>
              <option>B.Tech Information Technology</option>
              <option>B.Tech Electronics</option>
              <option>BCA</option>
              <option>MCA</option>
            </select>
            <span class="field-error" id="course-error"></span>
          </div>
          <div class="field">
            <label for="year">Year</label>
            <select id="year" name="year" aria-describedby="year-error" required>
              <option value="">Select year</option>
              <option>1st year</option>
              <option>2nd year</option>
              <option>3rd year</option>
              <option>4th year</option>
            </select>
            <span class="field-error" id="year-error"></span>
          </div>
        </div>

        <fieldset>
          <legend>Gender</legend>
          <div class="radio-group">
            <span class="radio-option"><input type="radio" id="gender-male" name="gender" value="Male"><label for="gender-male">Male</label></span>
            <span class="radio-option"><input type="radio" id="gender-female" name="gender" value="Female"><label for="gender-female">Female</label></span>
            <span class="radio-option"><input type="radio" id="gender-other" name="gender" value="Other"><label for="gender-other">Other</label></span>
          </div>
          <span class="field-error" id="gender-error"></span>
        </fieldset>

        <div class="check-line">
          <input type="checkbox" id="terms" name="terms" aria-describedby="terms-error" required>
          <label for="terms">I accept the terms and conditions</label>
        </div>
        <span class="field-error" id="terms-error"></span>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Create account</button>
        </div>
      </form>

      <p class="form-foot">Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </div>

  <div class="page-shell" style="text-align:center; padding-top: 0;">
    <a href="index.html" class="back-link">← Back to Home</a>
  </div>
</main>

<footer class="site-footer">
  <p>&copy; 2026 StudentHub, a student project in web development.</p>
  <p class="footer-badge">Charusat</p>
</footer>

<script src="js/script.js" defer></script>
</body>
</html>
