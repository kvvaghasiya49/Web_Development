<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register — StudentHub</title>
</head>
<body>

<header>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="register.html">Register</a></li>
    </ul>
</header>

    <div class="form-card wide">
      <h1>Create your account</h1>
      <p class="form-sub">Takes about two minutes.</p>

      <form action="dashboard.html" method="post">
        <div class="field">
          <label for="fullname">Full name</label>
          <input type="text" id="fullname" name="fullname" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" name="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="mobile">Mobile number</label>
          <input type="tel" id="mobile" name="mobile" autocomplete="tel" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" name="password" autocomplete="new-password" required>
          </div>
          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" required>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="course">Course</label>
            <select id="course" name="course" required>
              <option value="">Select course</option>
              <option>B.Tech Computer Engineering</option>
              <option>B.Tech Information Technology</option>
              <option>B.Tech Electronics</option>
              <option>BCA</option>
              <option>MCA</option>
            </select>
          </div>
          <div class="field">
            <label for="year">Year</label>
            <select id="year" name="year" required>
              <option value="">Select year</option>
              <option>1st year</option>
              <option>2nd year</option>
              <option>3rd year</option>
              <option>4th year</option>
            </select>
          </div>
        </div>

        <div>
          <input type="checkbox" id="terms" name="terms" required>
          <label for="terms">I accept the terms and conditions</label>
        </div>

        <div>
          <button type="submit" class="btn btn-primary">Create account</button>
        </div>
      </form>

      <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </div>

  <div>
    <a href="index.html" class="back-link">← Back to Home</a>
  </div>
</main>

<footer class="site-footer">
  <p>2026 StudentHub, a student project in web development.</p>
  <p>Charusat</p>
</footer>

</body>
</html>
