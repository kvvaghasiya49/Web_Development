<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile — StudentHub</title>
</head>
<body>
<header>
    <ul>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="attendance.html">Attendance</a></li>
      <li><a href="fees.html">Fees</a></li>
      <li><a href="announcements.html">Announcements</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li><a href="feedback.html">Feedback</a></li>
      <li><a href="login.html">Logout</a></li>
    </ul>
</header>
    <div class="page-head">
      <h1>My profile</h1>
      <p>Keep your details up to date.</p>
    </div>

    <form action="dashboard.html" method="post">
      <div class="profile-layout">
 <img src="https://example.com" alt="Description of the photo">



        <div class="profile-fields">
          <div class="field">
            <label for="p-fullname">Full name</label>
            <input type="text" id="p-fullname" name="fullname" autocomplete="name">
          </div>
          <div class="field">
            <label for="p-email">Email</label>
            <input type="email" id="p-email" name="email" autocomplete="email">
          </div>
          <div class="field">
            <label for="p-phone">Phone number</label>
            <input type="tel" id="p-phone" name="phone" autocomplete="tel">
          </div>
        </div>
      </div>

      <div>
        <div class="field">
          <label for="p-course">Course</label>
          <input type="text" id="p-course" name="course">
        </div>
        <div class="field">
          <label for="p-year">Year</label>
          <input type="text" id="p-year" name="year">
        </div>
      </div>

      <div>
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a href="dashboard.html">← Back to Dashboard</a>
      </div>
    </form>

  </div>
</main>

<footer class="site-footer">
  <p>2026 StudentHub, a student project in web development.</p>
  <p>Charusat</p>
</footer>

</body>
</html>
